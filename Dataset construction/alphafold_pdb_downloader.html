<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alphafold PDB downloader</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@1/css/pico.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .progress-container {
        width: 100%;
        background-color: #e0e0e0;
        border-radius: 5px;
        overflow: hidden;
        margin-top: 10px;
      }
      .progress-bar {
        width: 0;
        height: 20px;
        background-color: #76c7c0;
        transition: width 0.3s ease-in-out;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Alphafold PDB Downloader</h1>
      <form id="downloadForm">
        <label for="textInput" class="form-label"
          >Enter PDB IDs (comma-separated):</label
        >
        <textarea
          id="textInput"
          class="form-input"
          rows="10"
          required
          placeholder="P00509,P00803,P00804"
        ></textarea>
        <button type="button" onclick="startDownload()">
          Download
        </button>
        <div id="status"></div>
        <div class="progress-container">
          <div id="progressBar" class="progress-bar"></div>
        </div>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pako/dist/pako.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
let completedCount = 0;
let totalCount = 0;
const updateInterval = 5; // Update progress bar every 5 completed downloads

async function startDownload() {
  const textInput = document.getElementById("textInput");
  const statusDiv = document.getElementById("status");
  const progressBar = document.getElementById("progressBar");

  const nameList = textInput.value
    .split(",")
    .map((name) => name.trim())
    .filter((name) => name !== "");
  if (nameList.length === 0) {
    alert("Please enter at least one PDB ID.");
    return;
  }

  statusDiv.innerText = "Downloading...";
  progressBar.style.width = "0%";
  completedCount = 0;
  totalCount = nameList.length;

  const zip = new JSZip();
  const csvContent = ["uniprotAccession,isReviewed,globalMetricValue,sequenceLength\n"];

  await downloadFiles(nameList, zip, csvContent);

  // Add CSV file to ZIP
  zip.file("proteins.csv", csvContent.join(""));

  // Ensure progress bar is full
  updateProgressBar(progressBar);

  const zipBlob = await zip.generateAsync({ type: "blob" });
  const zipUrl = URL.createObjectURL(zipBlob);
  const link = document.createElement("a");
  link.href = zipUrl;
  link.download = "alphafold_pdb_files.zip";
  link.click();

  statusDiv.innerText = "Download completed!";
}

function updateProgressBar(progressBar) {
  const progress = (completedCount / totalCount) * 100;
  progressBar.style.width = progress + "%";
}

async function download(name, zip, csvContent) {
  try {
    const proteinData = await searchProtein(name);
    if (!proteinData) {
      throw new Error(`Protein data not found for ID: ${name}`);
    }

    const pdbUrl = await getPredictionPdbUrl(name);
    if (!pdbUrl) {
      throw new Error(`PDB URL not found for ID: ${name}`);
    }

    // Add protein data to CSV content
    csvContent.push(
      `${proteinData.uniprotAccession},${proteinData.isReviewed},${proteinData.globalMetricValue},${proteinData.sequenceLength}\n`
    );

    // Download PDB file
    const response = await fetch(pdbUrl);
    if (response.ok) {
      const data = await response.arrayBuffer();
      zip.file(`${name}.pdb`, data);

      // Increment completed count
      completedCount++;

      // Update progress bar periodically
      if (
        completedCount % updateInterval === 0 ||
        completedCount === totalCount
      ) {
        updateProgressBar(document.getElementById("progressBar"));
      }
    } else {
      console.error(`Error: ${response.status} ${response.statusText}`);
    }
  } catch (error) {
    console.error(`Error: ${name} ${error.message}`);
  }
}

async function downloadFiles(nameList, zip, csvContent) {
  await Promise.all(nameList.map((name) => download(name, zip, csvContent)));
}

async function searchProtein(id) {
  const url = `https://alphafold.ebi.ac.uk/api/search?q=(text%3A*${id}%20OR%20text%3A${id}*)&type=main&start=0&rows=1`;
  try {
    const response = await fetch(url);
    if (response.ok) {
      const data = await response.json();
      const doc = data.docs[0];
      return {
        isReviewed: doc.isReviewed,
        uniprotAccession: doc.uniprotAccession,
        globalMetricValue: doc.globalMetricValue,
        sequenceLength: doc.uniprotEnd - doc.uniprotStart + 1
      };
    } else {
      console.error(`Error: ${response.status} ${response.statusText}`);
      return null;
    }
  } catch (error) {
    console.error(`Error: ${url} ${error.message}`);
    return null;
  }
}

async function getPredictionPdbUrl(id) {
  const url = `https://alphafold.ebi.ac.uk/api/prediction/${id}`;
  try {
    const response = await fetch(url);
    if (response.ok) {
      const data = await response.json();
      return data[0].pdbUrl;
    } else {
      console.error(`Error: ${response.status} ${response.statusText}`);
      return null;
    }
  } catch (error) {
    console.error(`Error: ${url} ${error.message}`);
    return null;
  }
}

    </script>
  </body>
</html>
